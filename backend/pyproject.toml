[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cited-research-workbench"
version = "0.1.0"
description = "Page-cited PDF research with hybrid retrieval, approvals, audit trails, and SSE."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.9,<6",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
research-workbench = "research_workbench.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/research_workbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a disposable Qdrant service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["research_workbench"]
